<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>表格文件管理系统</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="tcl-header">
    <div class="tcl-logo">
      <div class="tcl-logo-mark">TCL</div>
      <div class="tcl-logo-text">
        表格文件管理系统
        <span>授权访问与管理</span>
      </div>
    </div>
    <div class="header-right">
      <span class="user-badge">当前用户：<strong id="currentUser">-</strong>（<span id="currentRole">-</span>）</span>
      <button type="button" id="btnLogout" class="btn btn-ghost btn-sm">退出登录</button>
    </div>
  </header>

  <div class="main-layout">
    <div class="main-body">
      <aside class="panel panel-files">
        <div class="panel-header">
          <span>文件列表</span>
          <div id="adminUploadArea" class="hidden">
            <label class="btn btn-primary btn-sm" style="cursor:pointer">
              上传文件
              <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" hidden />
            </label>
          </div>
        </div>
        <div class="panel-body">
          <div class="file-sort-bar">
            <label for="fileSortSelect">排序</label>
            <select id="fileSortSelect">
              <option value="time_desc">上传时间：近到久</option>
              <option value="time_asc">上传时间：久到近</option>
              <option value="name_asc">文件名：A 到 Z</option>
              <option value="name_desc">文件名：Z 到 A</option>
            </select>
          </div>
          <ul id="fileList" class="file-list"></ul>
          <p id="fileListEmpty" class="empty-hint hidden">暂无表格文件</p>
        </div>
        <div id="adminDrawer" class="admin-drawer hidden">
          <details open>
            <summary>管理员：用户账号管理</summary>
            <div class="admin-section user-manage">
              <h4>新建用户（不支持自助注册）</h4>
              <form id="addUserForm" class="add-user-form">
                <div class="form-group">
                  <label>用户名</label>
                  <input type="text" id="newUsername" required minlength="2" />
                </div>
                <div class="form-group">
                  <label>密码</label>
                  <input type="password" id="newPassword" required minlength="6" />
                </div>
                <div class="form-group">
                  <label>角色</label>
                  <select id="newRole">
                    <option value="user">普通用户</option>
                    <option value="admin">管理员</option>
                  </select>
                </div>
                <button type="submit" class="btn btn-primary btn-sm">创建</button>
              </form>
              <table class="user-table">
                <thead>
                  <tr>
                    <th>用户名</th>
                    <th>角色</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="userTableBody"></tbody>
              </table>
            </div>
          </details>
        </div>
      </aside>

      <main class="panel panel-preview">
        <div class="panel-header">
          <span id="previewTitle">表格预览</span>
          <div id="previewToolbar" class="preview-toolbar hidden">
            <span id="previewInfo"></span>
            <button type="button" id="btnDownloadFile" class="btn btn-outline btn-sm hidden">下载原文件</button>
            <button type="button" id="btnLoadMore" class="btn btn-outline btn-sm hidden">加载更多</button>
            <button type="button" id="btnDeleteFile" class="btn btn-danger btn-sm hidden">删除当前文件</button>
          </div>
        </div>
        <div class="panel-body preview-panel-body">
          <div id="sheetTabs" class="sheet-tabs hidden"></div>
          <div id="previewEmpty" class="empty-hint">请在左侧选择文件进行预览</div>
          <div id="tableScrollArea" class="table-scroll-area hidden">
            <div class="table-scroll-hint">← 左右滑动查看全部列 · 上下滑动查看全部行 →</div>
            <div id="tableWrap" class="table-wrap"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/js/app.js"></script>
</body>
</html>
